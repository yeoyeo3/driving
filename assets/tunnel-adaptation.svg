<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 610" role="img" aria-labelledby="t"><title id="t">터널 입구의 암순응과 출구의 명순응</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#dce9d8"/></marker></defs><rect x="1" y="1" width="518" height="608" rx="20" fill="#f4f5e8" stroke="#dce4da"/><rect x="12" y="188" width="496" height="228" rx="18" fill="#20332f"/><path d="M50 20H210V590H50Z" fill="#727b76"/><path d="M61 20V590M199 20V590" stroke="#fff" stroke-width="5"/><path d="M130 20V590" stroke="#fff" stroke-width="4" stroke-dasharray="22 18"/><path d="M50 190H210M50 416H210" stroke="#c2cfba" stroke-width="8"/><path d="M96 65V145M96 250V350M96 468V548" stroke="#dce9d8" stroke-width="6" marker-end="url(#a)"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#20332f"><text x="243" y="64" font-size="18" font-weight="700">낮의 밝은 도로</text><text x="243" y="109" font-size="26" font-weight="800">진입 → 암순응</text><text x="243" y="144" font-size="16">밝음 → 어둠에 적응</text><text x="243" y="258" font-size="22" font-weight="800" fill="#fff">터널 안</text><text x="243" y="299" font-size="16" fill="#cddfd2">안전거리 확보</text><text x="243" y="332" font-size="16" fill="#cddfd2">등화 켜기 · 앞지르기 금지</text><text x="243" y="476" font-size="18" font-weight="700">밖의 밝은 도로</text><text x="243" y="521" font-size="26" font-weight="800">진출 → 명순응</text><text x="243" y="556" font-size="16">어둠 → 밝음에 적응</text><text x="26" y="602" font-size="12" fill="#687b74">낮에 터널을 통과하는 개념도 · 위에서 아래로 진행</text></g></svg>