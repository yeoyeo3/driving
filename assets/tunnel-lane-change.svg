<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="t"><title id="t">백색 실선은 차로변경 금지, 점선은 안전 등 조건 확인 후 가능</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#81dfad"/></marker></defs><rect x="1" y="1" width="638" height="368" rx="18" fill="#f6f8f1" stroke="#dce4da"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#20332f"><text x="25" y="35" font-size="22" font-weight="800">백색 실선 → 변경 금지</text><text x="346" y="35" font-size="22" font-weight="800">백색 점선 → 조건부 가능</text><rect x="36" y="55" width="245" height="241" rx="12" fill="#52625e"/><rect x="359" y="55" width="245" height="241" rx="12" fill="#52625e"/><path d="M158 59V292" stroke="#fff" stroke-width="5"/><path d="M481 59V292" stroke="#fff" stroke-width="5" stroke-dasharray="19 15"/><g transform="translate(69 189)"><rect x="0" y="0" width="51" height="81" rx="12" fill="#b96552" stroke="#8a4437" stroke-width="2"/><rect x="8" y="15" width="35" height="20" rx="5" fill="#eef4f2"/><rect x="8" y="53" width="35" height="13" rx="4" fill="#eef4f2"/></g><g transform="translate(393 189)"><rect x="0" y="0" width="51" height="81" rx="12" fill="#b96552" stroke="#8a4437" stroke-width="2"/><rect x="8" y="15" width="35" height="20" rx="5" fill="#eef4f2"/><rect x="8" y="53" width="35" height="13" rx="4" fill="#eef4f2"/></g><path d="M104 181Q108 134 158 132H207" fill="none" stroke="#ff8d7d" stroke-width="5" stroke-dasharray="8 6"/><path d="M146 119L171 146M171 119L146 146" stroke="#ff8d7d" stroke-width="7" stroke-linecap="round"/><path d="M422 180Q423 132 478 132H552" stroke="#81dfad" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="29" y="327" font-size="16">실선을 넘어 차로를 바꾸지 않아요</text><text x="350" y="327" font-size="16">다른 제한이 없고 안전한 경우</text><text x="28" y="355" font-size="17" font-weight="800" fill="#9c4c38">터널 안 ‘앞지르기’는 점선이어도 금지</text></g></svg>