  <title id="title">어린이통학버스 신고증명서 부착 위치</title>
  <desc id="desc">차량 안에서 앞을 바라본 모습. 운전대는 왼쪽, 신고증명서는 앞유리의 우측 상단에 붙어 있다.</desc>
