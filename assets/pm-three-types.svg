<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 590" role="img" aria-labelledby="t"><title id="t">개인형 이동장치의 세 종류</title><rect width="540" height="590" rx="20" fill="#f4f7ef"/><g fill="none" stroke="#137a60" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="149" r="21"/><circle cx="194" cy="149" r="21"/><path d="M61 149H163L172 135V45H202M171 61H153"/><circle cx="76" cy="335" r="24" fill="#d7e8d9"/><circle cx="161" cy="335" r="24" fill="#d7e8d9"/><path d="M91 328H147M120 325V242H146"/><circle cx="53" cy="528" r="35"/><circle cx="184" cy="528" r="35"/><path d="M53 528L86 469L125 528H53L112 486H163L184 528M163 486L152 456H175M86 469L80 453M68 453H93"/><rect x="108" y="490" width="16" height="33" rx="4" fill="#b3d5bd" stroke-width="3"/></g><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#20332f"><text x="246" y="87" font-size="23" font-weight="800">전동킥보드</text><text x="246" y="122" font-size="18">전후로 놓인 바퀴 · 발판</text><text x="246" y="153" font-size="18" fill="#09634b">승차정원 1명</text><text x="246" y="267" font-size="23" font-weight="800">전동이륜평행차</text><text x="246" y="302" font-size="18">바퀴가 좌우로 나란해요</text><text x="246" y="333" font-size="18" fill="#09634b">승차정원 1명</text><text x="246" y="454" font-size="21" font-weight="800">모터 힘만으로 움직일</text><text x="246" y="483" font-size="21" font-weight="800">수 있는 자전거</text><text x="246" y="518" font-size="17">PM 기준 충족 시 해당</text><text x="246" y="549" font-size="18" fill="#09634b">법정 승차정원 2명</text><path d="M25 200H515M25 390H515" stroke="#dce4da"/><text x="23" y="582" font-size="12" fill="#687b74">종류 구분을 위한 개념도 · 모든 전동 이동기구가 PM은 아니에요</text></g></svg>