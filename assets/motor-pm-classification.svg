<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="t"><title id="t">원동기장치자전거와 개인형 이동장치의 포함 관계</title><rect x="10" y="10" width="600" height="320" rx="20" fill="#eef2e5" stroke="#b9cbb6" stroke-width="2"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#20332f"><text x="33" y="51" font-size="24" font-weight="800">원동기장치자전거 · 법적 차량 분류</text><text x="33" y="86" font-size="17">예: 법정 범위의 100cc 스쿠터 등</text><rect x="33" y="111" width="554" height="193" rx="16" fill="#e0f1e4" stroke="#137a60" stroke-width="3"/><text x="54" y="154" font-size="24" font-weight="800" fill="#09634b">그중 일부 = 개인형 이동장치(PM)</text><text x="54" y="194" font-size="18">25km/h 이상이면 모터 작동 안 함</text><text x="54" y="228" font-size="18">+ 차체 중량 30kg 미만 + 법정 종류·요건</text><text x="54" y="273" font-size="16">예: 기준을 충족한 전동킥보드</text><rect x="10" y="350" width="600" height="70" rx="15" fill="#fff3d9"/><text x="30" y="379" font-size="18" font-weight="800">전동기 = 전기 모터라는 ‘장치’의 이름</text><text x="30" y="405" font-size="15">차량 분류 이름과 구분해요. 전기차도 전동기를 사용해요.</text></g></svg>